<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORGE AI — Analysis Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════
       DESIGN TOKENS  (matches index.html)
    ══════════════════════════════════════════ */
    :root {
      --ink:      #0a0c10;
      --surface:  #0f1117;
      --panel:    #13161e;
      --lift:     #1a1f2e;
      --wire:     #1e2d42;
      --wire-lt:  #243550;
      --blue:     #2E75B6;
      --blue-lt:  #4a9fd4;
      --blue-dim: rgba(46,117,182,0.10);
      --text:     #d8dde8;
      --text-2:   #8a95a8;
      --text-3:   #4a5568;
      --green:    #22c55e;
      --red:      #ef4444;
      --mono:     'JetBrains Mono', monospace;
      --display:  'Barlow Condensed', sans-serif;
      --body:     'Barlow', sans-serif;
      --t:        0.18s ease;
    }

    /* ══════════════════════════════════════════
       RESET
    ══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; overflow: hidden; }
    body {
      background: var(--surface);
      color: var(--text);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    #root { display: flex; flex-direction: column; }

    /* ══════════════════════════════════════════
       SCROLLBAR
    ══════════════════════════════════════════ */
    .scr { scrollbar-width: thin; scrollbar-color: var(--wire) transparent; }
    .scr::-webkit-scrollbar { width: 4px; }
    .scr::-webkit-scrollbar-track { background: transparent; }
    .scr::-webkit-scrollbar-thumb { background: var(--wire); border-radius: 0; }

    /* ══════════════════════════════════════════
       ANIMATIONS
    ══════════════════════════════════════════ */
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulse   { 0%,100%{ opacity:1 } 50%{ opacity:.3 } }
    @keyframes dotAnim { 0%,80%,100%{ opacity:.2; transform:scale(.7) } 40%{ opacity:1; transform:scale(1) } }
    @keyframes scan    { 0%{ background-position: -500px 0 } 100%{ background-position: 500px 0 } }
    @keyframes ripple  { from { transform: scale(0); opacity: .6 } to { transform: scale(2.5); opacity: 0 } }

    .fade-up { animation: fadeUp .28s ease forwards; }
    .spin    { animation: spin 1.1s linear infinite; }
    .dot { display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--text-3); animation: dotAnim 1.4s ease-in-out infinite; }
    .dot:nth-child(2){ animation-delay:.18s; }
    .dot:nth-child(3){ animation-delay:.36s; }

    /* ══════════════════════════════════════════
       NAV
    ══════════════════════════════════════════ */
    .nav {
      flex-shrink: 0; height: 52px;
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--wire);
      z-index: 200;
      position: relative;
    }
    .nav-toggle {
      width: 30px; height: 30px;
      border: 1px solid var(--wire); background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3); transition: all var(--t); flex-shrink: 0;
    }
    .nav-toggle:hover { border-color: var(--wire-lt); color: var(--text); background: var(--lift); }

    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .nav-diamond {
      width: 18px; height: 18px;
      border: 1px solid var(--wire-lt);
      transform: rotate(45deg);
      display: flex; align-items: center; justify-content: center;
      color: var(--blue); flex-shrink: 0;
    }
    .nav-diamond svg { transform: rotate(-45deg); display: block; }
    .nav-wordmark {
      font-family: var(--display);
      font-size: 18px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .nav-wordmark em { color: var(--blue); font-style: normal; }
    .nav-sep   { width: 1px; height: 14px; background: var(--wire); }
    .nav-sub   { font-family: var(--mono); font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-3); }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .nav-status {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3);
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .nav-back {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3); text-decoration: none;
      padding: 5px 10px; border: 1px solid var(--wire); transition: all var(--t);
    }
    .nav-back:hover { color: var(--text); border-color: var(--wire-lt); background: var(--lift); }

    /* query counter pill */
    .nav-qcount {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--blue); padding: 3px 8px; border: 1px solid rgba(46,117,182,0.3);
      background: var(--blue-dim);
    }

    /* ══════════════════════════════════════════
       WORKSPACE SHELL
    ══════════════════════════════════════════ */
    .workspace { flex: 1; display: flex; overflow: hidden; }

    /* ══════════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════════ */
    .sidebar {
      width: 268px; flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--wire);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: width 0.24s cubic-bezier(0.4,0,0.2,1), opacity 0.18s ease;
    }
    .sidebar.closed { width: 0; opacity: 0; pointer-events: none; }

    .sb-sec { padding: 16px; border-bottom: 1px solid var(--wire); }
    .sb-label {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .sb-label::after { content: ''; flex: 1; height: 1px; background: var(--wire); }

    /* Dropzone */
    .sb-dz {
      border: 1px dashed var(--wire-lt);
      background: rgba(26,31,46,0.4);
      padding: 22px 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer; position: relative; text-align: center;
      transition: border-color var(--t), background var(--t);
    }
    .sb-dz:hover, .sb-dz.over { border-color: var(--blue); background: var(--blue-dim); }
    .sb-dz input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .sb-dz-icon {
      width: 34px; height: 34px; border: 1px solid var(--wire-lt);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3); pointer-events: none;
      transition: border-color var(--t), color var(--t);
    }
    .sb-dz:hover .sb-dz-icon, .sb-dz.over .sb-dz-icon { border-color: var(--blue); color: var(--blue); }
    .sb-dz-text { font-family: var(--mono); font-size: 10px; color: var(--text-3); pointer-events: none; }
    .sb-dz-hint { font-family: var(--mono); font-size: 9px; color: var(--text-3); opacity: 0.5; pointer-events: none; }

    /* Upload progress */
    .sb-uploading {
      padding: 18px 12px; display: flex; flex-direction: column;
      align-items: center; gap: 10px; text-align: center;
    }
    .sb-upload-bar { width: 100%; height: 2px; background: var(--wire); overflow: hidden; }
    .sb-upload-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--wire) 0%, var(--blue) 50%, var(--wire) 100%);
      background-size: 300px 100%;
      animation: scan 1.8s ease-in-out infinite;
    }
    .sb-upload-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }

    /* Upload error */
    .sb-err {
      border: 1px solid rgba(239,68,68,0.25); background: rgba(239,68,68,0.06);
      padding: 10px 12px;
    }
    .sb-err-msg { font-family: var(--mono); font-size: 10px; color: var(--red); line-height: 1.6; margin-bottom: 8px; }
    .sb-err-retry {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-3); background: none; border: 1px solid var(--wire);
      padding: 5px 10px; cursor: pointer; width: 100%; transition: all var(--t);
    }
    .sb-err-retry:hover { border-color: var(--wire-lt); color: var(--text); }

    /* File info */
    .sb-file { background: var(--lift); border: 1px solid var(--wire); padding: 10px 12px; }
    .sb-file-name {
      font-family: var(--mono); font-size: 11px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px;
    }
    .sb-file-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .sb-badge {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.10em;
      text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--blue); color: var(--blue);
    }
    .sb-size { font-family: var(--mono); font-size: 9px; color: var(--text-3); margin-left: auto; }
    .sb-file-btns { display: flex; gap: 5px; }
    .sb-btn {
      flex: 1; font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 7px 4px; text-align: center;
      border: 1px solid var(--wire); background: transparent;
      color: var(--text-2); cursor: pointer; transition: all var(--t);
    }
    .sb-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
    .sb-btn.danger:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.08); }

    /* Guided chips */
    .guide-list { display: flex; flex-direction: column; gap: 4px; }
    .guide-chip {
      width: 100%; text-align: left; padding: 8px 10px;
      border: 1px solid var(--wire); background: transparent;
      color: var(--text-2); cursor: pointer;
      display: flex; align-items: flex-start; gap: 8px;
      font-family: var(--body); font-size: 12px; line-height: 1.5;
      transition: all var(--t);
    }
    .guide-chip:hover:not(:disabled) { border-color: var(--wire-lt); color: var(--text); background: rgba(26,31,46,0.7); }
    .guide-chip:disabled { opacity: 0.3; cursor: not-allowed; }
    .guide-num { font-family: var(--mono); font-size: 9px; color: var(--blue); flex-shrink: 0; margin-top: 2px; }

    /* Sidebar footer */
    .sb-footer {
      margin-top: auto; padding: 12px 16px;
      border-top: 1px solid var(--wire);
      display: flex; align-items: center; gap: 7px;
    }
    .sb-footer-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }

    /* ══════════════════════════════════════════
       MAIN CONVERSATION AREA
    ══════════════════════════════════════════ */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }

    /* ── Messages container ── */
    .messages {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .messages-inner {
      width: 100%; max-width: 880px; margin: 0 auto;
      padding: 40px 44px; display: flex; flex-direction: column; gap: 36px;
    }

    /* ── Empty state ── */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; user-select: none; text-align: center; padding: 40px;
    }
    .empty-hex {
      width: 56px; height: 56px;
      border: 1px solid var(--wire);
      transform: rotate(45deg);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3); margin-bottom: 4px;
    }
    .empty-hex svg { transform: rotate(-45deg); display: block; }
    .empty-title { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
    .empty-desc  { font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; line-height: 2.1; max-width: 340px; }
    .empty-badge {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--green); padding: 4px 10px; border: 1px solid rgba(34,197,94,0.25);
      background: rgba(34,197,94,0.07); margin-top: 6px;
    }
    .empty-badge svg { flex-shrink: 0; }

    /* ── Message: user ── */
    .msg-user { display: flex; justify-content: flex-end; }
    .msg-user-inner { max-width: 68%; }
    .msg-meta {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
    }
    .msg-user .msg-meta { text-align: right; }
    .msg-user-bubble {
      background: var(--lift); border: 1px solid var(--wire-lt);
      padding: 12px 16px; font-size: 14px; line-height: 1.75; color: var(--text);
    }

    /* ── Message: AI ── */
    .msg-ai { display: flex; flex-direction: column; }
    .msg-ai-card {
      background: var(--panel); border: 1px solid var(--wire);
      border-left: 2px solid var(--blue); overflow: hidden;
    }
    .msg-thinking {
      padding: 8px 20px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em;
      color: var(--text-3); font-style: italic;
      border-bottom: 1px solid var(--wire); opacity: 0.8;
    }
    .msg-body { padding: 20px 26px; }

    /* Markdown inside AI response */
    .msg-body p { font-size: 14px; line-height: 1.9; color: var(--text); margin: 0 0 10px; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-body h2 {
      font-family: var(--display); font-size: 20px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; color: var(--text);
      margin: 22px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--wire);
    }
    .msg-body h3 {
      font-family: var(--display); font-size: 15px; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-2);
      margin: 16px 0 6px;
    }
    .msg-body h2:first-child, .msg-body h3:first-child { margin-top: 0; }
    .msg-body ul, .msg-body ol { padding-left: 20px; margin: 8px 0 12px; display: flex; flex-direction: column; gap: 5px; }
    .msg-body li { font-size: 14px; line-height: 1.8; color: var(--text); }
    .msg-body strong { font-weight: 600; color: var(--text); }
    .msg-body em { color: var(--text-2); font-style: italic; }
    .msg-body code {
      font-family: var(--mono); font-size: 11px;
      background: var(--lift); border: 1px solid var(--wire);
      padding: 1px 5px; color: var(--blue-lt);
    }
    .msg-body hr { border: none; border-top: 1px solid var(--wire); margin: 16px 0; }

    /* ══════════════════════════════════════════
       REPORT SECTION HEADINGS (rendered via renderMarkdown)
       These style the ## headings inside .msg-body
    ══════════════════════════════════════════ */
    /* Section divider line between report sections */
    .msg-body h2 + p, .msg-body h2 + ul, .msg-body h2 + ol { margin-top: 4px; }
    /* Analysis & Calculations section — monospace code lines feel like derivations */
    .msg-body code { font-family: var(--mono); font-size: 11.5px; background: var(--ink); border: 1px solid var(--wire); padding: 2px 6px; color: var(--blue-lt); }
    /* Confidence Level: colour the High/Medium/Low token */
    .msg-body p:has(strong) { }

    /* ── Export button ── */
    .msg-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-export {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-3); background: none; border: 1px solid var(--wire);
      padding: 5px 10px; cursor: pointer; transition: all var(--t);
    }
    .btn-export:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }

    /* ── History panel ── */
    .history-list { display: flex; flex-direction: column; gap: 3px; }
    .history-item {
      width: 100%; text-align: left; padding: 7px 10px;
      border: 1px solid var(--wire); background: transparent; cursor: pointer;
      display: flex; flex-direction: column; gap: 3px; transition: all var(--t);
    }
    .history-item:hover { border-color: var(--wire-lt); background: rgba(26,31,46,0.5); }
    .history-q { font-family: var(--body); font-size: 11px; color: var(--text-2); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
    .history-ts { font-family: var(--mono); font-size: 9px; color: var(--text-3); }

    /* ══════════════════════════════════════════
       PRINT / PDF EXPORT
    ══════════════════════════════════════════ */
    #print-frame { display: none; }
    @media print {
      #root          { display: none !important; }
      #print-frame   { display: block !important; padding: 48px 56px; color: #000; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.7; }
    }
    /* Print frame content styles (only rendered during print) */
    .pf-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 16px; border-bottom: 2px solid #000; margin-bottom: 24px; }
    .pf-brand  { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .pf-date   { font-family: Arial, sans-serif; font-size: 11px; color: #555; text-align: right; }
    .pf-question { padding: 12px 16px; background: #f4f4f4; border-left: 3px solid #000; margin-bottom: 28px; }
    .pf-q-label { font-family: Arial, sans-serif; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #666; margin-bottom: 4px; }
    .pf-q-text  { font-size: 14px; font-weight: 600; font-family: Arial, sans-serif; }
    .pf-body h2 { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #bbb; }
    .pf-body h3 { font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; margin: 16px 0 6px; }
    .pf-body p  { margin: 0 0 8px; }
    .pf-body ul, .pf-body ol { padding-left: 22px; margin: 6px 0 12px; }
    .pf-body li { margin: 3px 0; }
    .pf-body strong { font-weight: 700; }
    .pf-body code   { font-family: 'Courier New', monospace; font-size: 11px; background: #f0f0f0; padding: 1px 4px; }
    .pf-footer { margin-top: 48px; padding-top: 14px; border-top: 1px solid #ccc; font-family: Arial, sans-serif; font-size: 10px; color: #999; text-align: center; }

    /* ── Message: loading ── */
    .msg-loading-card {
      background: var(--panel); border: 1px solid var(--wire);
      border-left: 2px solid var(--wire-lt);
      padding: 16px 26px; display: flex; align-items: center; gap: 12px;
    }
    .loading-text { font-family: var(--mono); font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-3); }

    /* ── Message: error ── */
    .msg-error-card {
      background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.22);
      border-left: 2px solid var(--red);
      padding: 14px 26px; font-family: var(--mono); font-size: 11px; color: var(--red); line-height: 1.7;
    }

    /* ══════════════════════════════════════════
       INPUT BAR
    ══════════════════════════════════════════ */
    .input-bar {
      flex-shrink: 0;
      background: var(--panel); border-top: 1px solid var(--wire);
      padding: 14px 44px 16px;
    }
    .input-bar-inner { max-width: 880px; margin: 0 auto; }

    /* File attachment row */
    .attach-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .attach-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--blue); padding: 3px 8px; border: 1px solid rgba(46,117,182,0.3);
      background: var(--blue-dim);
    }
    .attach-x { background: none; border: none; color: var(--text-3); cursor: pointer; line-height: 0; transition: color var(--t); padding: 0; margin-left: 2px; }
    .attach-x:hover { color: var(--red); }
    .attach-view {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-3); background: none; border: 1px solid var(--wire); padding: 3px 8px; cursor: pointer;
      transition: all var(--t);
    }
    .attach-view:hover { border-color: var(--wire-lt); color: var(--text); }

    /* Input row */
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .input-field { flex: 1; border: 1px solid var(--wire); background: var(--surface); transition: border-color var(--t); }
    .input-field:focus-within { border-color: var(--blue); }
    .input-field textarea {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--body); font-size: 14px;
      padding: 11px 14px; resize: none; line-height: 1.6; max-height: 130px;
    }
    .input-field textarea::placeholder { color: var(--text-3); }
    .send-btn {
      width: 44px; height: 44px; background: var(--blue); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0; transition: background var(--t), transform 0.1s;
      position: relative; overflow: hidden;
    }
    .send-btn:hover:not(:disabled) { background: var(--blue-lt); }
    .send-btn:active:not(:disabled) { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .input-hint { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; color: var(--text-3); margin-top: 6px; }

    /* ══════════════════════════════════════════
       FILE PREVIEW MODAL
    ══════════════════════════════════════════ */
    .modal-bg {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(10,12,16,0.90);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
    }
    .modal-bg.open { opacity: 1; pointer-events: all; }
    .modal-box {
      width: 92vw; max-width: 1360px; height: 91vh;
      background: var(--panel); border: 1px solid var(--wire);
      display: flex; flex-direction: column;
      transform: translateY(18px) scale(0.985);
      transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-bg.open .modal-box { transform: none; }
    .modal-bar {
      flex-shrink: 0; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 1px solid var(--wire);
    }
    .modal-bar-left { display: flex; align-items: center; gap: 10px; }
    .modal-fname  { font-family: var(--mono); font-size: 11px; color: var(--text); }
    .modal-fbadge {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.10em; text-transform: uppercase;
      padding: 2px 6px; border: 1px solid var(--blue); color: var(--blue);
    }
    .modal-close {
      width: 30px; height: 30px; border: 1px solid var(--wire); background: transparent;
      cursor: pointer; color: var(--text-3); display: flex; align-items: center; justify-content: center;
      transition: all var(--t);
    }
    .modal-close:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.08); }
    .modal-view { flex: 1; overflow: hidden; }
    .modal-view iframe { width: 100%; height: 100%; border: none; background: var(--surface); }
    .modal-img-wrap { height: 100%; display: flex; align-items: center; justify-content: center; padding: 28px; overflow: auto; }
    .modal-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>
<div id="root"></div>

<div id="print-frame"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script type="text/babel">
  const { useState, useRef, useEffect, useCallback } = React;

  const API           = 'http://localhost:8000';
  const ALLOWED_TYPES = ['application/pdf', 'image/png', 'image/jpeg'];
  const MAX_BYTES     = 10 * 1024 * 1024;

  /* ── SVG shorthand ── */
  const Ico = ({ d, size = 16, style }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'block', flexShrink: 0, ...style }}
      dangerouslySetInnerHTML={{ __html: d }} />
  );
  const I = {
    menu:   '<line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>',
    x:      '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
    file:   '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    eye:    '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    send:   '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    alert:  '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    loader: '<line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>',
    check:  '<polyline points="20 6 9 17 4 12"/>',
    layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
    warn:   '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  };

  /* ── Timestamp formatter ── */
  function formatTs(iso) {
    const diff = Date.now() - new Date(iso);
    if (diff < 60000)    return 'just now';
    if (diff < 3600000)  return `${Math.floor(diff / 60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  /* ── Print frame HTML builder ── */
  function buildPrintHTML(question, response, date) {
    const safe = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const bodyHtml = response
      .replace(/^## (.+)$/gm, (_, t) => `<h2>${t}</h2>`)
      .replace(/^### (.+)$/gm, (_, t) => `<h3>${t}</h3>`)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^[-*] (.+)$/gm, (_, t) => `<li>${t}</li>`)
      .replace(/^\d+\. (.+)$/gm, (_, t) => `<li>${t}</li>`)
      .replace(/^---+$/gm, '<hr>')
      .split('\n')
      .map(line => (line.trim() && !line.trim().startsWith('<')) ? `<p>${line}</p>` : line)
      .join('\n');
    return `
      <div class="pf-header">
        <span class="pf-brand">&#9670; FORGE AI</span>
        <span class="pf-date">Analysis Report &middot; ${date}</span>
      </div>
      <div class="pf-question">
        <div class="pf-q-label">Engineering Query</div>
        <div class="pf-q-text">${safe(question)}</div>
      </div>
      <div class="pf-body">${bodyHtml}</div>
      <div class="pf-footer">Generated by FORGE AI &middot; forge-ai.engineering</div>
    `;
  }

  /* ── Markdown helpers ── */
  function parseInline(text) {
    const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/);
    return parts.map((p, i) => {
      if (p.startsWith('**') && p.endsWith('**')) return <strong key={i}>{p.slice(2, -2)}</strong>;
      if (p.startsWith('`')  && p.endsWith('`'))  return <code key={i}>{p.slice(1, -1)}</code>;
      return p;
    });
  }
  function renderMarkdown(text) {
    const lines = text.split('\n');
    const out = [];
    let listBuf = [], listType = null, k = 0;
    const flush = () => {
      if (!listBuf.length) return;
      const Tag = listType === 'ol' ? 'ol' : 'ul';
      out.push(<Tag key={k++}>{listBuf.map((item, i) => <li key={i}>{item}</li>)}</Tag>);
      listBuf = []; listType = null;
    };
    for (const raw of lines) {
      if      (/^##\s/.test(raw))         { flush(); out.push(<h2 key={k++}>{parseInline(raw.slice(3))}</h2>); }
      else if (/^###\s/.test(raw))        { flush(); out.push(<h3 key={k++}>{parseInline(raw.slice(4))}</h3>); }
      else if (/^[-*]\s/.test(raw))       { if (listType && listType !== 'ul') flush(); listType = 'ul'; listBuf.push(parseInline(raw.slice(2))); }
      else if (/^\d+\.\s/.test(raw))      { if (listType && listType !== 'ol') flush(); listType = 'ol'; listBuf.push(parseInline(raw.replace(/^\d+\.\s/, ''))); }
      else if (/^---+$/.test(raw.trim())) { flush(); out.push(<hr key={k++} />); }
      else if (raw.trim() === '')         { flush(); }
      else                                { flush(); out.push(<p key={k++}>{parseInline(raw)}</p>); }
    }
    flush();
    return out;
  }
  function parseAIResponse(text) {
    const pre = /^(I need to|Let me|I should|I'll |I will |I'm going to|I can |Based on|Looking at|To answer|To provide|Given the|First,|My response|Here I)/i;
    const paras = text.split(/\n\n+/);
    if (paras.length > 1 && pre.test(paras[0].trim())) {
      return { thinking: paras[0].trim(), response: paras.slice(1).join('\n\n').trim() };
    }
    return { thinking: null, response: text };
  }

  /* ══════════════════════════════════════════
     NAV
  ══════════════════════════════════════════ */
  function Nav({ sidebarOpen, onToggle, queryCount }) {
    return (
      <nav className="nav">
        <button className="nav-toggle" onClick={onToggle} aria-label={sidebarOpen ? 'Close sidebar' : 'Open sidebar'}>
          <Ico d={sidebarOpen ? I.x : I.menu} size={14} />
        </button>

        <a href="index.html" className="nav-brand">
          <div className="nav-diamond">
            <svg width="7" height="7" viewBox="0 0 7 7" fill="currentColor">
              <rect x="1.5" y="1.5" width="4" height="4" />
            </svg>
          </div>
          <span className="nav-wordmark">FORGE <em>AI</em></span>
        </a>
        <span className="nav-sep" />
        <span className="nav-sub">Analysis Workspace</span>

        <div className="nav-right">
          {queryCount > 0 && (
            <span className="nav-qcount">{queryCount} {queryCount === 1 ? 'query' : 'queries'}</span>
          )}
          <div className="nav-status">
            <span className="status-dot" style={{ animation: 'pulse 2.5s ease-in-out infinite' }} />
            Backend Online
          </div>
          <a href="index.html" className="nav-back">← Site</a>
        </div>
      </nav>
    );
  }

  /* ══════════════════════════════════════════
     SIDEBAR
  ══════════════════════════════════════════ */
  function Sidebar({ open, file, fileType, isUploading, uploadError, onFile, onClear, onViewFile, isQuerying, onChipQuery, aiQuestions, history, onLoadHistory }) {
    const [over, setOver] = useState(false);

    const fileSize = file
      ? (file.size / 1024 < 1024 ? `${(file.size / 1024).toFixed(0)} KB` : `${(file.size / 1048576).toFixed(1)} MB`)
      : '';
    const hasFile = !!file && !isUploading && !uploadError;

    const validate = (f) => {
      if (!f) return;
      if (!ALLOWED_TYPES.includes(f.type)) return alert('Unsupported type. Use PDF, PNG, or JPG.');
      if (f.size > MAX_BYTES) return alert('File exceeds 10 MB limit.');
      onFile(f);
    };
    const onDragOver  = (e) => { e.preventDefault(); if (!file) setOver(true); };
    const onDragLeave = () => setOver(false);
    const onDrop      = (e) => { e.preventDefault(); setOver(false); if (!file) validate(e.dataTransfer.files[0]); };
    const onInput     = (e) => { validate(e.target.files[0]); e.target.value = ''; };

    return (
      <aside className={`sidebar${open ? '' : ' closed'}`}>

        {/* ── File section ── */}
        <div className="sb-sec">
          <div className="sb-label">File Context</div>

          {/* No file — dropzone */}
          {!file && (
            <div className={`sb-dz${over ? ' over' : ''}`}
              onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}>
              <input type="file" accept=".pdf,.png,.jpg,.jpeg" onChange={onInput} />
              <div className="sb-dz-icon"><Ico d={I.upload} size={18} /></div>
              <span className="sb-dz-text">{over ? 'Release to upload' : 'Drop file to analyse'}</span>
              <span className="sb-dz-hint">PDF · PNG · JPG — max 10 MB</span>
            </div>
          )}

          {/* Uploading / analyzing */}
          {file && isUploading && (
            <div className="sb-uploading">
              <Ico d={I.loader} size={18} style={{ animation: 'spin 1.1s linear infinite', color: 'var(--text-3)' }} />
              <div className="sb-upload-bar"><div className="sb-upload-fill" /></div>
              <span className="sb-upload-label">Analyzing file…</span>
            </div>
          )}

          {/* Error */}
          {file && !isUploading && uploadError && (
            <div className="sb-err">
              <p className="sb-err-msg">{uploadError}</p>
              <button className="sb-err-retry" onClick={onClear}>Try Again</button>
            </div>
          )}

          {/* File loaded */}
          {hasFile && (
            <div className="sb-file">
              <div className="sb-file-name" title={file.name}>{file.name}</div>
              <div className="sb-file-meta">
                <span className="sb-badge">{fileType?.toUpperCase() ?? 'FILE'}</span>
                <span className="sb-size">{fileSize}</span>
              </div>
              <div className="sb-file-btns">
                <button className="sb-btn" onClick={onViewFile}>View File</button>
                <button className="sb-btn danger" onClick={onClear}>Clear</button>
              </div>
            </div>
          )}
        </div>

        {/* ── Guided analysis section ── */}
        {hasFile && aiQuestions.length > 0 && (
          <div className="sb-sec" style={{ flex: 1, overflowY: 'auto' }}>
            <div className="sb-label">Guided Analysis</div>
            <div className="guide-list">
              {aiQuestions.map((q, i) => (
                <button key={i} className="guide-chip" onClick={() => onChipQuery(q)} disabled={isQuerying}>
                  <span className="guide-num">{String(i + 1).padStart(2, '0')}.</span>
                  {q}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ── Session history ── */}
        {history && history.length > 0 && (
          <div className="sb-sec scr" style={{ flex: '0 0 auto', overflowY: 'auto', maxHeight: 220 }}>
            <div className="sb-label">Session History</div>
            <div className="history-list">
              {history.slice(0, 8).map(item => (
                <button key={item.id} className="history-item" onClick={() => onLoadHistory(item)}>
                  <span className="history-q">{item.question.length > 55 ? item.question.slice(0, 55) + '…' : item.question}</span>
                  <span className="history-ts">{formatTs(item.ts)}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ── Sidebar footer ── */}
        <div className="sb-footer">
          <span className="status-dot" style={{ animation: 'pulse 2.5s ease-in-out infinite' }} />
          <span className="sb-footer-label">System Online</span>
        </div>
      </aside>
    );
  }

  /* ══════════════════════════════════════════
     MESSAGES
  ══════════════════════════════════════════ */
  function Msg({ role, content, question, onExport }) {
    if (role === 'loading') return (
      <div className="fade-up">
        <div className="msg-meta">Forge AI · Analysing</div>
        <div className="msg-loading-card">
          <div style={{ display: 'flex', gap: 5 }}>
            <span className="dot" /><span className="dot" /><span className="dot" />
          </div>
          <span className="loading-text">Processing your query</span>
        </div>
      </div>
    );

    if (role === 'ai') {
      return (
        <div className="msg-ai fade-up">
          <div className="msg-meta" style={{ marginBottom: 6 }}>Forge AI</div>
          <div className="msg-ai-card">
            <div className="msg-body">{renderMarkdown(content)}</div>
          </div>
          {question && onExport && (
            <div className="msg-actions">
              <button className="btn-export" onClick={() => onExport(question, content)}>
                Export Report ↗
              </button>
            </div>
          )}
        </div>
      );
    }

    if (role === 'error') return (
      <div className="fade-up">
        <div className="msg-meta">Connection Error</div>
        <div className="msg-error-card">{content}</div>
      </div>
    );

    /* user */
    return (
      <div className="msg-user fade-up">
        <div className="msg-user-inner">
          <div className="msg-meta">You</div>
          <div className="msg-user-bubble">{content}</div>
        </div>
      </div>
    );
  }

  /* ══════════════════════════════════════════
     INPUT BAR
  ══════════════════════════════════════════ */
  function InputBar({ hasFile, file, isQuerying, onQuery, onClear, onViewFile }) {
    const [input, setInput] = useState('');
    const taRef = useRef(null);

    const send = () => {
      const q = input.trim();
      if (!q || isQuerying) return;
      onQuery(q); setInput('');
    };
    const handleKey = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

    return (
      <div className="input-bar">
        <div className="input-bar-inner">
          {/* Attached file badge */}
          {hasFile && (
            <div className="attach-row">
              <div className="attach-pill">
                <Ico d={I.file} size={10} />
                {file.name}
                <button className="attach-x" onClick={onClear} aria-label="Remove file">
                  <Ico d={I.x} size={9} />
                </button>
              </div>
              <button className="attach-view" onClick={onViewFile}>
                View File ↗
              </button>
            </div>
          )}

          {/* Text input */}
          <div className="input-row">
            <div className="input-field">
              <textarea
                ref={taRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKey}
                placeholder={hasFile ? 'Ask a question about this file…' : 'Ask an engineering question…'}
                disabled={isQuerying}
                rows={2}
                className="scr"
              />
            </div>
            <button className="send-btn" onClick={send} disabled={!input.trim() || isQuerying} aria-label="Send query">
              <Ico d={I.send} size={14} />
            </button>
          </div>
          <p className="input-hint">Enter to send · Shift+Enter for new line</p>
        </div>
      </div>
    );
  }

  /* ══════════════════════════════════════════
     FILE PREVIEW MODAL
  ══════════════════════════════════════════ */
  function FileModal({ open, onClose, file, fileUrl, fileType }) {
    useEffect(() => {
      const esc = (e) => { if (e.key === 'Escape') onClose(); };
      if (open) document.addEventListener('keydown', esc);
      return () => document.removeEventListener('keydown', esc);
    }, [open, onClose]);

    return (
      <div className={`modal-bg${open ? ' open' : ''}`}
        onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="modal-box">
          <div className="modal-bar">
            <div className="modal-bar-left">
              <span className="modal-fname">{file?.name ?? 'File Preview'}</span>
              {fileType && <span className="modal-fbadge">{fileType.toUpperCase()}</span>}
            </div>
            <button className="modal-close" onClick={onClose} aria-label="Close preview">
              <Ico d={I.x} size={13} />
            </button>
          </div>
          <div className="modal-view">
            {fileType === 'pdf' && fileUrl && (
              <iframe src={fileUrl} title={file?.name} />
            )}
            {fileType === 'image' && fileUrl && (
              <div className="modal-img-wrap">
                <img src={fileUrl} alt={file?.name ?? 'File preview'} />
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  /* ══════════════════════════════════════════
     APP ROOT
  ══════════════════════════════════════════ */
  function App() {
    const [sidebarOpen, setSidebarOpen] = useState(true);
    const [file,        setFile]        = useState(null);
    const [fileUrl,     setFileUrl]     = useState(null);
    const [fileType,    setFileType]    = useState(null);
    const [fileContext, setFileContext] = useState('');
    const [aiQuestions, setAiQuestions] = useState([]);
    const [isUploading, setIsUploading] = useState(false);
    const [uploadError, setUploadError] = useState(null);
    const [messages,    setMessages]    = useState([]);
    const [isQuerying,  setIsQuerying]  = useState(false);
    const [modalOpen,   setModalOpen]   = useState(false);
    const [history,     setHistory]     = useState(() => {
      try { return JSON.parse(localStorage.getItem('forge-history') || '[]'); } catch { return []; }
    });
    const bottomRef = useRef(null);

    const hasFile    = !!file && !isUploading && !uploadError;
    const queryCount = messages.filter(m => m.role === 'user').length;

    useEffect(() => {
      bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
    }, [messages, isQuerying]);

    const handleFile = useCallback(async (dropped) => {
      if (fileUrl) URL.revokeObjectURL(fileUrl);
      setFile(dropped); setFileUrl(URL.createObjectURL(dropped));
      setFileType(null); setFileContext(''); setAiQuestions([]); setUploadError(null); setIsUploading(true);
      const form = new FormData();
      form.append('file', dropped);
      try {
        const { data } = await axios.post(`${API}/analyze-file`, form);
        setFileType(data.file_type);
        setFileContext(data.content);
        setAiQuestions(data.questions ?? []);
      } catch (err) {
        setUploadError(err.response?.data?.detail ?? 'Upload failed — is the backend running on port 8000?');
      } finally { setIsUploading(false); }
    }, [fileUrl]);

    const handleClear = useCallback(() => {
      if (fileUrl) URL.revokeObjectURL(fileUrl);
      setFile(null); setFileUrl(null); setFileType(null);
      setFileContext(''); setAiQuestions([]); setUploadError(null);
    }, [fileUrl]);

    const saveToHistory = useCallback((question, response) => {
      const item = { id: Date.now(), question, response, ts: new Date().toISOString() };
      setHistory(prev => {
        const updated = [item, ...prev].slice(0, 20);
        try { localStorage.setItem('forge-history', JSON.stringify(updated)); } catch {}
        return updated;
      });
    }, []);

    const handleExport = useCallback((question, response) => {
      const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('print-frame').innerHTML = buildPrintHTML(question, response, date);
      window.print();
    }, []);

    const handleLoadHistory = useCallback((item) => {
      setMessages(prev => [
        ...prev,
        { role: 'user', content: item.question, id: Date.now()     },
        { role: 'ai',   content: item.response,  question: item.question, id: Date.now() + 1 },
      ]);
      setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: 'smooth' }), 50);
    }, []);

    const handleQuery = useCallback(async (query) => {
      if (!query.trim() || isQuerying) return;
      setMessages(prev => [...prev, { role: 'user', content: query, id: Date.now() }]);
      setIsQuerying(true);
      try {
        const { data } = await axios.post(`${API}/query`, { query, file_context: fileContext });
        setMessages(prev => [...prev, { role: 'ai', content: data.response, question: query, id: Date.now() + 1 }]);
        saveToHistory(query, data.response);
      } catch (err) {
        setMessages(prev => [...prev, {
          role: 'error',
          content: err.response?.data?.detail ?? 'Query failed — is the backend running on port 8000?',
          id: Date.now() + 1,
        }]);
      } finally { setIsQuerying(false); }
    }, [fileContext, isQuerying, saveToHistory]);

    /* ── Empty state content ── */
    const renderEmpty = () => {
      if (hasFile) return (
        <div className="empty">
          <div className="empty-hex">
            <Ico d={I.file} size={20} />
          </div>
          <p className="empty-title">File Analyzed</p>
          <p className="empty-desc">
            <strong style={{ color: 'var(--text-2)', fontWeight: 500 }}>{file.name}</strong> has been
            processed. FORGE AI generated {aiQuestions.length} targeted questions
            — click them in the sidebar to start, or type your own below.
          </p>
          <div className="empty-badge">
            <Ico d={I.check} size={10} />
            {aiQuestions.length} guided questions ready
          </div>
        </div>
      );

      return (
        <div className="empty">
          <div className="empty-hex">
            <Ico d={I.layers} size={20} />
          </div>
          <p className="empty-title">Workspace Ready</p>
          <p className="empty-desc">
            Upload an engineering file via the sidebar<br />
            to enable context-aware analysis,<br />
            or ask a technical question directly.
          </p>
        </div>
      );
    };

    return (
      <>
        <Nav sidebarOpen={sidebarOpen} onToggle={() => setSidebarOpen(s => !s)} queryCount={queryCount} />

        <div className="workspace">
          <Sidebar
            open={sidebarOpen}
            file={file} fileType={fileType}
            isUploading={isUploading} uploadError={uploadError}
            onFile={handleFile} onClear={handleClear}
            onViewFile={() => setModalOpen(true)}
            isQuerying={isQuerying}
            onChipQuery={handleQuery}
            aiQuestions={aiQuestions}
            history={history}
            onLoadHistory={handleLoadHistory}
          />

          <main className="main">
            <div className="messages scr">
              {messages.length === 0 && !isQuerying
                ? renderEmpty()
                : (
                  <div className="messages-inner">
                    {messages.map(m => <Msg key={m.id} role={m.role} content={m.content} question={m.question} onExport={handleExport} />)}
                    {isQuerying && <Msg key="loading" role="loading" />}
                    <div ref={bottomRef} style={{ height: 1 }} />
                  </div>
                )
              }
            </div>

            <InputBar
              hasFile={hasFile}
              file={file}
              isQuerying={isQuerying}
              onQuery={handleQuery}
              onClear={handleClear}
              onViewFile={() => setModalOpen(true)}
            />
          </main>
        </div>

        <FileModal
          open={modalOpen}
          onClose={() => setModalOpen(false)}
          file={file} fileUrl={fileUrl} fileType={fileType}
        />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
